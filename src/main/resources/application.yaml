spring:
  application:
    name: sgsm
  mvc:
    problemdetails:
      enabled: true

  datasource:
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 5
    url: jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
      ddl-auto: none
    show-sql: true

jwt:
  secret: ${JWT_SECRET:sgsm-chave-desenvolvimento-local-minimo-256-bits-nao-usar-em-producao}

ia:
  base-url: ${IA_BASE_URL:http://localhost:8082}

evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8084}
    key: ${EVOLUTION_API_KEY:}
    instance: ${EVOLUTION_INSTANCE:sgsm}

whatsapp:
  webhook-token: ${WHATSAPP_WEBHOOK_TOKEN:}
