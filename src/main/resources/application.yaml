spring:
  application:
    name: sgsm
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Mesmo SMTP do ms-sboot-auth (MailerSend). Sem usuário/senha, o alerta de WhatsApp fica só no log.
  mail:
    host: ${SMTP_HOST:smtp.mailersend.net}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

# Observabilidade: log estruturado (JSON, formato ECS) + tracing distribuido. O traceId/spanId
# entra automaticamente no MDC (e portanto no log estruturado) e se propaga sozinho entre os
# 4 servicos via header HTTP "traceparent" - nao precisa de codigo manual de correlacao.
management:
  # SMTP fora do ar não pode derrubar o health do sgsm
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  structured:
    format:
      console: ecs
