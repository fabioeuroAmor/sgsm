logging:
  file:
    name: sgsm.log

spring:
  application:
    name: sgsm
  mvc:
    problemdetails:
      enabled: true

  datasource:
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 5
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
      ddl-auto: none
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  # Compartilhado com ms-sboot-auth e sgsm-ia — os tres precisam do MESMO valor.
  secret: ${JWT_SECRET:?defina JWT_SECRET (mesmo valor usado em ms-sboot-auth e sgsm-ia) antes de subir}

ia:
  base-url: ${IA_BASE_URL:http://localhost:8082}

evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8084}
    key: ${EVOLUTION_API_KEY:}
    instance: ${EVOLUTION_INSTANCE:sgsm}

whatsapp:
  webhook-token: ${WHATSAPP_WEBHOOK_TOKEN:}
