spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 20
      minimumIdle: 5
      idleTimeout: 600000
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
    ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

jwt:
  secret: ${JWT_SECRET}

sgsm:
  crypto:
    cpf-key: ${CPF_CRYPTO_KEY}
    cpf-hmac-key: ${CPF_HMAC_KEY}

logging:
  level:
    root: WARN
    br.com.sgsm: INFO
