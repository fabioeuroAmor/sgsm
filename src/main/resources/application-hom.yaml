spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 10
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
    ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

sgsm:
  # Auto-cadastro público de paciente: o sgsm cria o login no ms-sboot-auth (servidor a servidor)
  auth:
    base-url: ${AUTH_BASE_URL}
  autocadastro:
    limite-por-ip: 5
  crypto:
    cpf-key: ${CPF_CRYPTO_KEY}
    cpf-hmac-key: ${CPF_HMAC_KEY}

logging:
  level:
    root: INFO
    br.com.sgsm: INFO
