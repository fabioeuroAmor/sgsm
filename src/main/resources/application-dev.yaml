spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified
    username: postgres
    password: postgres
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 5
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
    ddl-auto: none
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: sgsm-chave-desenvolvimento-local-minimo-256-bits-nao-usar-em-producao

logging:
  level:
    br.com.sgsm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
